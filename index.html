<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1d2e" />
    <title>mojs — desktop mates for the web</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bar">
      <select id="kind" title="Creature to add">
        <option value="random">🎲 Random</option>
        <option value="critter">Critter</option>
        <option value="squirrel">Squirrel</option>
        <option value="bee">Bee</option>
        <option value="whale">Whale</option>
        <option value="minke">Minke</option>
        <option value="snail">Snail</option>
        <option value="cat">Cat</option>
        <option value="pigeon">Pigeon</option>
        <option value="piglet">Piglet</option>
      </select>
      <button id="add" title="Add a creature">＋</button>
      <button id="remove" title="Remove a creature">－</button>
      <button id="speed" title="Pause / resume">⏸ Pause</button>
    </div>
    <noscript>mojs needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
